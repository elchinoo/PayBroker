# LOCAL DEVELOPMENT ONLY. Set POSTGRES_PASSWORD in your git-ignored .env (see .env.example).
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: paybroker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: paybroker
    ports: ["127.0.0.1:5435:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paybroker"]
      interval: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://paybroker:${POSTGRES_PASSWORD}@db:5432/paybroker
      # First run prints a one-time setup code: see `docker compose logs api`.
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    command: paybroker start
volumes:
  pgdata:
